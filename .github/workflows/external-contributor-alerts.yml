name: Alert on external contributions
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
jobs:
  alert:
    permissions:
      issues: write
      pull-requests: write
    uses: hyperdxio/.github/.github/workflows/external-contributor-alerts.yml@main
    secrets: inherit
